name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-lane:
    name: Fast Lane Validation
    runs-on: macos-14
    timeout-minutes: 10
    outputs:
      run_full_suite: ${{ steps.classify.outputs.run_full_suite }}
      is_docs_only: ${{ steps.classify.outputs.is_docs_only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify Changes and Validate Documentation
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          RUN_FULL_SUITE=true
          IS_DOCS_ONLY=false
          BASE=""
          HEAD=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              BASE="$BASE_SHA"
            elif [ -n "$BASE_REF" ]; then
              BASE=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)
            fi

            if [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              HEAD="$HEAD_SHA"
            else
              HEAD="HEAD"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE="$BEFORE_SHA"
              HEAD="$CURRENT_SHA"
            fi
          fi

          if [ -n "$BASE" ] && [ -n "$HEAD" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null && git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD" || true)
            if [ -n "$CHANGED_FILES" ]; then
              ALL_DOCS=true
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  *.md|*.markdown)
                    case "$file" in
                      .github/*|fixtures/*|Tests/*|Sources/*|App/*|FileProviderExtension/*|Resources/*)
                        ALL_DOCS=false
                        break
                        ;;
                    esac
                    ;;
                  *)
                    ALL_DOCS=false
                    break
                    ;;
                esac
              done <<< "$CHANGED_FILES"

              if [ "$ALL_DOCS" = "true" ]; then
                RUN_FULL_SUITE=false
                IS_DOCS_ONLY=true
              fi
            fi
          fi

          if [ "$IS_DOCS_ONLY" = "true" ]; then
            echo "Docs-only markdown changes detected. Running lightweight documentation validation..."
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ -f "$file" ]; then
                iconv -f UTF-8 -t UTF-8 "$file" > /dev/null
                if grep -En '^<{7}[[:space:]]|^={7}$|^>{7}[[:space:]]' "$file" /dev/null; then
                  echo "Error: Unresolved merge conflict marker found in $file" >&2
                  exit 1
                fi
              fi
            done <<< "$CHANGED_FILES"

            git diff --check "$BASE" "$HEAD" -- '*.md' '*.markdown' || true
            echo "Documentation validation passed successfully."
          else
            echo "Full CI suite required (source, test, project, workflow, config, or fail-closed diff)."
          fi

          echo "run_full_suite=$RUN_FULL_SUITE" >> "$GITHUB_OUTPUT"
          echo "is_docs_only=$IS_DOCS_ONLY" >> "$GITHUB_OUTPUT"

  core-build-and-test:
    name: Build and Core Tests
    needs: fast-lane
    if: needs.fast-lane.outputs.run_full_suite == 'true'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version
          XCODE_VER=$(xcodebuild -version | head -n 1 | tr ' ' '-')
          echo "XCODE_VERSION=$XCODE_VER" >> "$GITHUB_ENV"

      - name: Cache Build Artifacts and Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            build/DerivedData/SourcePackages
            build/DerivedData/Build/Intermediates.noindex
            build/DerivedData/Build/Products
          key: spm-deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-ios-generic-${{ hashFiles('Package.resolved', 'Package.swift', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            spm-deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-ios-generic-${{ hashFiles('Package.resolved', 'Package.swift', 'project.yml') }}-
            spm-deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-ios-generic-

      - name: Run Core Swift Tests
        run: |
          set -euo pipefail
          swift test --enable-code-coverage 2>&1 | tee swift-test.log
          PROFDATA=$(find .build -name "default.profdata" | head -n 1)
          BIN=$(find .build -name "ShhCorePackageTests.xctest" | head -n 1)
          if [ -n "$PROFDATA" ] && [ -n "$BIN" ]; then
            TEST_BIN="$BIN/Contents/MacOS/ShhCorePackageTests"
            if [ -f "$TEST_BIN" ]; then
              xcrun llvm-cov export -format="lcov" "$TEST_BIN" -instr-profile="$PROFDATA" > swift-coverage.lcov || true
            fi
          fi

      - name: Upload Core Swift Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: swift-coverage.lcov
          flags: swift
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

      - name: Upload Swift Coverage Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: swift-coverage-artifact
          path: swift-coverage.lcov
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Generic iOS Targets (Unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Shh.xcodeproj \
            -scheme Shh \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild-app.log

          xcodebuild build \
            -project Shh.xcodeproj \
            -scheme ShhFileProvider \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild-fp.log

          Tests/verify-app-icon.sh build/DerivedData/Build/Products/Debug-iphoneos/Shh.app

      - name: Upload Core Build and Test Logs on Failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ci-failure-artifacts-core-build
          path: |
            *.log
          retention-days: 7

  simulator-tests:
    name: ${{ matrix.name }}
    needs: fast-lane
    if: needs.fast-lane.outputs.run_full_suite == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone Simulator Tests
            device_type: iPhone
            platform: ios-sim-iphone
            result_bundle: iphone-tests.xcresult
            log_prefix: iphone-tests
          - name: iPad Simulator Tests
            device_type: iPad
            platform: ios-sim-ipad
            result_bundle: ipad-tests.xcresult
            log_prefix: ipad-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version
          XCODE_VER=$(xcodebuild -version | head -n 1 | tr ' ' '-')
          echo "XCODE_VERSION=$XCODE_VER" >> "$GITHUB_ENV"

      - name: Cache Build Artifacts and Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
            build/DerivedData/Build/Intermediates.noindex
            build/DerivedData/Build/Products
          key: spm-deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('Package.resolved', 'Package.swift', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            spm-deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('Package.resolved', 'Package.swift', 'project.yml') }}-
            spm-deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ matrix.platform }}-

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Discover and Boot Simulator
        id: simulators
        env:
          DEVICE_TYPE: ${{ matrix.device_type }}
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          target = os.environ.get("DEVICE_TYPE", "")
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" in runtime:
                  for d in devices:
                      if target in d.get("name", "") and d.get("isAvailable"):
                          print(d["udid"])
                          sys.exit(0)
          ')

          echo "$DEVICE_TYPE Simulator ID: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          if [ -n "$DEVICE_ID" ]; then
            xcrun simctl boot "$DEVICE_ID" || true
          else
            echo "Error: No available $DEVICE_TYPE simulator found" >&2
            exit 1
          fi

      - name: Build For Testing
        if: steps.simulators.outputs.device_id != ''
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Shh.xcodeproj \
            -scheme ShhAppTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulators.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "${{ matrix.log_prefix }}-build.log"

      - name: Test Without Building
        if: steps.simulators.outputs.device_id != ''
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project Shh.xcodeproj \
            -scheme ShhAppTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulators.outputs.device_id }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "${{ matrix.result_bundle }}" \
            -enableCodeCoverage YES \
            2>&1 | tee "${{ matrix.log_prefix }}-tests.log"

      - name: Export Xcode Coverage Report
        if: always() && steps.simulators.outputs.device_id != ''
        run: |
          if [ -d "${{ matrix.result_bundle }}" ]; then
            xcrun xccov view --report --json "${{ matrix.result_bundle }}" > "${{ matrix.log_prefix }}-coverage.json" || true
          fi

      - name: Upload Simulator Coverage to Codecov
        if: always() && steps.simulators.outputs.device_id != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: "${{ matrix.log_prefix }}-coverage.json"
          flags: ${{ matrix.platform }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

      - name: Upload Simulator Coverage Artifact
        if: always() && steps.simulators.outputs.device_id != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.platform }}-coverage-artifact
          path: |
            ${{ matrix.result_bundle }}
            ${{ matrix.log_prefix }}-coverage.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Test Results and Logs on Failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ci-failure-artifacts-${{ matrix.platform }}
          path: |
            *.xcresult
            *.log
          retention-days: 7
