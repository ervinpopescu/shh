name: Shh
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShhCore:
    path: .
targets:
  Shh:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ShhCore
        product: ShhCore
      - package: ShhCore
        product: ShhSSH
      - package: ShhCore
        product: ShhTerminal
      - package: ShhCore
        product: ShhVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Shh records only while you hold the local push-to-talk control."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Shh uses on-device speech recognition only when selected for local voice transcription."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
  ShhCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhCoreTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  ShhSSHTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhSSHTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.ssh.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  ShhTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhTerminalTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.terminal.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  ShhVoiceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhVoiceTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.voice.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  ShhAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhAppTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

