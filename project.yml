name: Shh
options:
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShhCore:
    path: .
targets:
  Shh:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Shared
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LiveActivity/SSHSessionActivity.swift
    dependencies:
      - target: ShhFileProvider
      - target: ShhLiveActivity
      - sdk: ActivityKit.framework
      - package: ShhCore
        product: ShhCore
      - package: ShhCore
        product: ShhSSH
      - package: ShhCore
        product: ShhTerminal
      - package: ShhCore
        product: ShhVoice
    info:
      path: App/Info.plist
      properties:
        NSBonjourServices:
          - _ssh._tcp
        NSLocalNetworkUsageDescription: >-
          Shh discovers SSH servers on your local network.
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ervinpopescu.shh.live-activity
            CFBundleURLSchemes:
              - shh
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_ENTITLEMENTS: App/Shh.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          Shh records only while you hold the local push-to-talk control.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: >-
          Shh uses on-device speech recognition only when selected for
          local voice transcription.
  ShhCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhCoreTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.tests
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
  ShhSSHTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhSSHTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.ssh.tests
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
  ShhTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhTerminalTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.terminal.tests
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
  ShhVoiceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/ShhVoiceTests]
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.voice.tests
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
  ShhAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/ShhAppTests
      - FileProviderExtension/FileProviderEnumerator.swift
      - FileProviderExtension/FileProviderExtension.swift
      - FileProviderExtension/FileProviderItem.swift
      - FileProviderExtension/FileProviderSessionManager.swift
      - Shared
    dependencies:
      - target: Shh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.app.tests
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        GENERATE_INFOPLIST_FILE: YES
  ShhLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LiveActivity
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.LiveActivity
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: LiveActivity/Info.plist
        SKIP_INSTALL: YES

  ShhFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FileProviderExtension
      - Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ShhCore
        product: ShhCore
      - package: ShhCore
        product: ShhSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervinpopescu.shh.FileProvider
        SWIFT_VERSION: "5.9"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_ENTITLEMENTS: >-
          FileProviderExtension/ShhFileProvider.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        INFOPLIST_FILE: FileProviderExtension/Info.plist
